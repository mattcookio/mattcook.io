<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Redirecting...</title>
		<script>
			// Store the attempted path segment
			var segment = window.location.pathname.split('/').filter(Boolean).pop() || '';

			// Preserve query parameters and hash
			var search = window.location.search;
			var hash = window.location.hash;

			// Store the redirect info in sessionStorage
			// Using sessionStorage ensures it's cleared once the browser session ends
			sessionStorage.redirect = segment + search + hash;

			// Redirect to the root index.html
			// GitHub Pages automatically serves the root index.html for the base URL
			window.location.replace(window.location.origin);
		</script>
	</head>
	<body>
		<p>If you are not redirected automatically, <a href="/">click here</a>.</p>
	</body>
</html>
